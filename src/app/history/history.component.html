<app-menu></app-menu>
<div class="h-screen bg-[#212D42] flex flex-col justify-center p-26">
  <div class="bg-[#DCEAFF] h-full p-6 rounded-lg shadow-md flex flex-col">
    <!-- Thanh tìm kiếm -->
    <div class="flex items-center gap-4 mb-4">
      <p-calendar
        [(ngModel)]="startDate"
        placeholder="Từ ngày"
        dateFormat="dd/mm/yy HH:mm:ss"
        [showTime]="true"
        hourFormat="24"
      ></p-calendar>
      <p-calendar
        [(ngModel)]="endDate"
        placeholder="Đến ngày"
        dateFormat="dd/mm/yy HH:mm:ss"
        [showTime]="true"
        hourFormat="24"
      ></p-calendar>
      <p-button label="Tìm kiếm" icon="pi pi-search"></p-button>
    </div>

    <!-- Bảng lịch sử -->

    <p-table
      [value]="history"
      [paginator]="true"
      [rows]="10"
      [tableStyle]="{ 'min-width': '50rem' }"
      class="shadow-md rounded-lg"
    >
      <!-- Tiêu đề bảng -->
      <ng-template pTemplate="header">
        <tr>
          <th style="width: 30%">Thiết Bị</th>
          <th style="width: 20%">Trạng Thái</th>
          <th style="width: 50%">Thời Gian</th>
        </tr>
      </ng-template>

      <!-- Nội dung bảng -->
      <ng-template pTemplate="body" let-entry>
        <tr>
          <td>{{ entry.device }}</td>
          <td
            [ngClass]="{
              'text-green-600 font-semibold': entry.status === 'Bật',
              'text-red-600 font-semibold': entry.status === 'Tắt'
            }"
          >
            {{ entry.status }}
          </td>
          <td>{{ entry.timestamp | date : "dd/MM/yyyy HH:mm:ss" }}</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
