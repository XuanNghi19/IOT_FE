<div class="flex justify-between items-center h-screen bg-[#212D42] p-6">
  <div class="flex flex-1 flex-col items-center justify-center gap-6">
    <form
      #loginForm="ngForm"
      (ngSubmit)="login()"
      class="flex flex-col items-center gap-6"
    >
      <div class="flex flex-col gap-2">
        <label class="text-2xl text-white" for="username">Username</label>
        <input
          pInputText
          id="username"
          type="text"
          class="w-[300px] font-light"
          required
          name="username"
          [(ngModel)]="username"
          #usernameRef="ngModel"
        />
        <span
          class="text-red-500"
          *ngIf="usernameRef.invalid && usernameRef.touched"
        >
          Username is required!
        </span>
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-2xl text-white" for="password">Password</label>
        <input
          pInputText
          id="password"
          type="password"
          class="w-[300px] font-light"
          required
          name="password"
          [(ngModel)]="password"
          #passwordRef="ngModel"
        />
        <span
          class="text-red-500"
          *ngIf="passwordRef.invalid && passwordRef.touched"
        >
          Password is required!
        </span>
      </div>

      <div class="flex">
        <button
          pButton
          label="Đăng nhập"
          icon="pi pi-user"
          class="w-[200px] flex justify-between items-center"
          styleClass="w-full mx-auto"
          type="submit"
          [disabled]="loginForm.invalid"
        ></button>
      </div>
    </form>
  </div>
  <div
    class="w-[2px] h-full rounded-full bg-[#4287f5] flex justify-center items-center"
  ></div>
  <img
    class="h-full ml-8 rounded-2xl flex flex-1 object-cover"
    src="house.webp"
  />
</div>
